[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ada"
version = "0.1.0"
description = "Agentic database assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.5",
    "langfuse",
    "openai",
    "psycopg2-binary",
    "pydantic",
]

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]
